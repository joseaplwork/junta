<ion-card>
  <ion-card-header>
    <ion-card-title>Connection</ion-card-title>
  </ion-card-header>

  <ion-card-content>
    @switch (status()) {
      @case ('checking') {
        <ion-spinner name="dots" aria-label="Checking the connection" />
      }
      @case ('online') {
        <ion-chip color="success">Connected to the API</ion-chip>
      }
      @case ('offline') {
        <ion-chip color="danger">Cannot reach the API</ion-chip>
        <ion-button fill="clear" (click)="check()">Retry</ion-button>
      }
    }
  </ion-card-content>
</ion-card>

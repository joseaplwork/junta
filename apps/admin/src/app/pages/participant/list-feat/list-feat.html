<ja-crud-data-table
  [data]="participants()"
  [columns]="columns"
  [actions]="actions"
  [loading]="loading()"
  [error]="error()"
  emptyMessage="No participants found. Click the + button to create one."
  loadingMessage="Loading participants..."
  (view)="viewParticipant($event)"
  (edit)="editParticipant($event)"
  (delete)="deleteParticipant($event)" />

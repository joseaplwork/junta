<ja-crud-data-table
  [data]="juntas()"
  [columns]="columns"
  [actions]="actions"
  [loading]="loading()"
  [error]="error()"
  emptyMessage="No juntas found. Click the + button to create one."
  loadingMessage="Loading juntas..."
  (view)="viewJunta($event)"
  (edit)="editJunta($event)"
  (delete)="deleteJunta($event)" />

<button
  mat-fab
  color="primary"
  class="!fixed bottom-8 right-8 shadow-lg"
  aria-label="Create junta"
  (click)="createJunta()">
  <mat-icon>add</mat-icon>
</button>

<div class="mb-6 flex items-center gap-4">
  <button mat-icon-button type="button" aria-label="Back" (click)="cancel()">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <h1 class="text-2xl font-bold">
    {{ isEditMode() ? 'Edit Junta' : 'Create Junta' }}
  </h1>
</div>

@if (loading()) {
  <div class="flex justify-center p-8">
    <p>Loading junta...</p>
  </div>
} @else {
  <ja-junta-form
    [initialJunta]="junta()"
    [roles]="roles()"
    [participants]="participants()"
    [loadingParticipants]="loadingParticipants()"
    [submitting]="submitting()"
    [submitLabel]="isEditMode() ? 'Update Junta' : 'Create Junta'"
    (submitRequest)="save($event)"
    (cancelForm)="cancel()" />
}

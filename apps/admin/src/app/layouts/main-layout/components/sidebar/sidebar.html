<div class="bg-surface-dim flex h-screen w-screen">
  <aside
    [style.width]="collapsed() ? '64px' : '256px'"
    class="border-outline-variant bg-surface-container flex h-full flex-shrink-0 flex-col overflow-hidden border-r transition-[width] duration-300 ease-in-out">
    <div
      class="border-outline-variant flex items-center border-b p-2"
      [class.justify-center]="collapsed()"
      [class.justify-between]="!collapsed()">
      @if (!collapsed()) {
        <h2 class="text-primary pl-2 text-xl font-semibold">Logo</h2>
      }
      <button
        mat-icon-button
        type="button"
        class="text-muted"
        aria-label="Toggle navigation"
        (click)="toggle()">
        <mat-icon>{{ collapsed() ? 'menu' : 'menu_open' }}</mat-icon>
      </button>
    </div>

    <div class="flex-grow overflow-y-auto overflow-x-hidden">
      <nav class="flex flex-col gap-1 p-2">
        @for (item of menuItems; track item.route) {
          <a
            *jaHasPermission="item.permission ?? null"
            routerLinkActive="bg-primary/20 text-primary"
            matTooltipPosition="right"
            class="hover:bg-surface flex items-center gap-3 rounded-lg px-3 py-2 transition-colors"
            [routerLink]="item.route"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            [matTooltip]="collapsed() ? item.label : ''"
            [class.justify-center]="collapsed()"
            [class.px-2]="collapsed()">
            <mat-icon class="flex-shrink-0">{{ item.icon }}</mat-icon>
            @if (!collapsed()) {
              <span class="whitespace-nowrap">{{ item.label }}</span>
            }
          </a>
        }
      </nav>
    </div>

    <div class="border-outline-variant mt-auto border-t p-2">
      @if (!collapsed()) {
        <p class="text-muted mb-2 truncate px-3 text-center">
          {{ profile.email() }}
        </p>
        <button
          mat-flat-button
          type="button"
          color="warn"
          class="flex w-full items-center justify-center gap-2"
          (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      } @else {
        <div class="flex justify-center">
          <button
            mat-icon-button
            type="button"
            color="warn"
            matTooltip="Logout"
            matTooltipPosition="right"
            aria-label="Logout"
            (click)="logout()">
            <mat-icon>logout</mat-icon>
          </button>
        </div>
      }
    </div>
  </aside>

  <main class="h-full flex-1 overflow-auto p-5">
    <ng-content />
  </main>
</div>

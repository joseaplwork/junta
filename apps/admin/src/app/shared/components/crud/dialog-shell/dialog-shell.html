<h2 mat-dialog-title class="flex items-center gap-2">
  @if (icon()) {
    <mat-icon>{{ icon() }}</mat-icon>
  }
  {{ title() }}
</h2>

<mat-dialog-content class="grid gap-4">
  <ng-content />
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button
    mat-stroked-button
    type="button"
    [disabled]="submitting()"
    (click)="cancelAction.emit()">
    Cancel
  </button>
  <button
    mat-flat-button
    type="button"
    color="primary"
    class="flex items-center justify-center"
    [disabled]="!formValid() || submitting()"
    (click)="submitAction.emit()">
    @if (submitting()) {
      <mat-icon><mat-spinner diameter="18" /></mat-icon>
    }
    <span>{{ submitLabel() }}</span>
  </button>
</mat-dialog-actions>

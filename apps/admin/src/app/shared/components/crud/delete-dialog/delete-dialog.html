<h2 mat-dialog-title class="flex items-center gap-2">
  <mat-icon color="warn">delete</mat-icon>
  Delete {{ data.entityName }}
</h2>

<mat-dialog-content>
  <p>
    Are you sure you want to delete
    <strong>{{ data.displayName }}</strong
    >?
  </p>
  <p class="text-muted mt-2 text-sm">This action cannot be undone.</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button
    mat-stroked-button
    type="button"
    [disabled]="deleting()"
    (click)="onCancel()">
    Cancel
  </button>
  <button
    mat-flat-button
    type="button"
    color="warn"
    class="flex items-center justify-center"
    [disabled]="deleting()"
    (click)="onDelete()">
    @if (deleting()) {
      <mat-icon><mat-spinner diameter="18" /></mat-icon>
    }
    <span>Delete</span>
  </button>
</mat-dialog-actions>

<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>{{ data.message }}</mat-dialog-content>
<mat-dialog-actions align="end">
  <button
    mat-stroked-button
    type="button"
    class="mr-3"
    [mat-dialog-close]="false">
    {{ data.cancelText }}
  </button>
  <button
    mat-flat-button
    type="button"
    cdkFocusInitial
    [mat-dialog-close]="true">
    {{ data.confirmText }}
  </button>
</mat-dialog-actions>
